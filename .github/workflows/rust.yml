name: Rust

on:
  push:
    branches: [ "branch-change" ]
  pull_request:
    branches: [ "branch-change" ]

env:
  CARGO_TERM_COLOR: always
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libopencv-dev \
            llvm-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  lint-and-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libopencv-dev llvm-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check